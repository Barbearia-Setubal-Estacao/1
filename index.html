<style>
:root{--bg:#171513;--bg2:#211e1b;--line:#38332d;--text:#efe9df;--mute:#a69d90;--gold:#c49a52;--red:#a3322b;--blue:#2c4a6b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:17px/1.65 Georgia,"Times New Roman",serif}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:5;background:rgba(23,21,19,.96);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{font-size:19px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;font-weight:700}
.logo span{color:var(--gold)}
nav{display:flex;gap:22px;align-items:center;font:13px Arial,Helvetica,sans-serif;letter-spacing:.12em;text-transform:uppercase}
nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--gold)}
.lang{display:flex;border:1px solid var(--line)}
.lang button{background:none;border:0;color:var(--mute);padding:6px 11px;font:12px Arial,sans-serif;letter-spacing:.1em;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#171513}
.hero{padding:96px 0 84px;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.eyebrow{font:13px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
h1{font-size:clamp(38px,6vw,68px);line-height:1.06;font-weight:400;margin-bottom:22px}
.hero p{color:var(--mute);max-width:46ch;margin-bottom:32px}
.btn{display:inline-block;padding:14px 28px;background:var(--gold);color:#171513;border:0;text-decoration:none;font:700 13px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:#d8ae63}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);margin-left:10px}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.art{display:flex;justify-content:center}
.art svg{width:100%;max-width:340px;height:auto}
section{padding:84px 0;border-bottom:1px solid var(--line)}
h2{font-size:clamp(28px,4vw,40px);font-weight:400;margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:44px}
.pole{height:6px;margin-bottom:22px;width:90px;background:repeating-linear-gradient(110deg,var(--red) 0 10px,#efe9df 10px 20px,var(--blue) 20px 30px)}
.prices{max-width:720px}
.row{display:flex;align-items:baseline;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.row .n{font-size:19px}.row .d{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.row .p{color:var(--gold);font-weight:700}
.row small{display:block;color:var(--mute);font:13px Arial,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--bg2);border:1px solid var(--line);padding:28px}
.card h3{font-weight:400;font-size:20px;margin:14px 0 6px}
.card p{color:var(--mute);font-size:15px}
.card svg{width:38px;height:38px;stroke:var(--gold);fill:none;stroke-width:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.hours div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.hours span:last-child{color:var(--mute)}
.info p{margin-bottom:12px;color:var(--mute)}.info strong{color:var(--text);font-weight:400}
form{background:var(--bg2);border:1px solid var(--line);padding:30px}
label{display:block;font:12px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:12px 14px;background:var(--bg);color:var(--text);border:1px solid var(--line);font:16px Georgia,serif;border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
textarea{resize:vertical;min-height:84px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .btn{width:100%;margin-top:24px}
.err{color:#e08a82;font:14px Arial,sans-serif;margin-top:14px;min-height:20px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gal figure{position:relative;aspect-ratio:4/5;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.gal figure:nth-child(1),.gal figure:nth-child(6){grid-column:span 2;aspect-ratio:auto}
.gal img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.25) contrast(1.05)}
.gal .ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--line)}
.gal .ph svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.5}
.map{border:1px solid var(--line);margin-top:34px}
.map iframe{display:block;width:100%;height:360px;border:0}
footer{padding:36px 0;color:var(--mute);font:14px Arial,sans-serif}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:820px){
 .hero .wrap,.two,.grid{grid-template-columns:1fr}
 .art{order:-1}.art svg{max-width:200px}
 nav a{display:none}.hero{padding:56px 0}section{padding:60px 0}
 .btn.ghost{margin:12px 0 0}.gal{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}
}
</style>
</head>

     ou links https:// diretos. Se deixar "" aparece um espaço reservado. */
  gallery: [
    { src: "fotos/01.jpg", pt: "Corte clássico",       en: "Classic haircut" },
    { src: "fotos/02.jpg", pt: "Acabamento à navalha", en: "Razor finish" },

  ]
};

var TEXT = {

  nav_services:"Serviços",nav_gallery:"Galeria",g_title:"O nosso trabalho",g_sub:"Cortes, barbas e o ambiente da barbearia.",nav_hours:"Horário",nav_book:"Marcar",nav_find:"Localização",
  eyebrow:"Barbearia · Setúbal",
  hero_title:"Corte certo. Barba bem feita.",
  hero_text:"Barbearia tradicional no centro de Setúbal, junto à Praça do Brasil. Atendimento com calma, técnica e atenção ao detalhe.",

 }
};
/* ============================================================ */

var lang = (navigator.language || "pt").slice(0,2) === "en" ? "en" : "pt";
try { var saved = localStorage.getItem("lang"); if (saved === "pt" || saved === "en") lang = saved; } catch(e){}

function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function digits(s){ return String(s).replace(/\D+/g,""); }

function renderLists(){
  var p = $("prices"); p.textContent = "";
  var sel = $("fService"); var keep = sel.selectedIndex; sel.textContent = "";
  CONFIG.services.forEach(function(s, i){
    var row = el("div","row");
    var left = el("div"); left.style.flex = "0 1 auto";
    left.appendChild(el("span","n", s[lang]));
    left.appendChild(el("small",null, lang === "pt" ? s.ptNote : s.enNote));
    row.appendChild(left); row.appendChild(el("span","d"));
    row.appendChild(el("span","p", s.price));
    p.appendChild(row);
    var o = el("option", null, s[lang] + " — " + s.price); o.value = String(i); sel.appendChild(o);
  });
  if (keep > -1) sel.selectedIndex = keep;
  var h = $("hours"); h.textContent = "";
  CONFIG.hours.forEach(function(x){
    var d = el("div");
    d.appendChild(el("span",null,x[lang]));
    d.appendChild(el("span",null, typeof x.time === "object" ? x.time[lang] : x.time));
    h.appendChild(d);
  });
}

function safeSrc(u){
  u = String(u || "").trim();
  if (/^https:\/\/[^\s"'<>]+$/i.test(u)) return u;
  if (/^[\w\-\/]+\.(jpe?g|png|webp|avif)$/i.test(u)) return u;
  return "";
}
function placeholder(){
  var d = el("div","ph");
  d.innerHTML = '<svg viewBox="0 0 40 40"><circle cx="11" cy="29" r="5"/><circle cx="29" cy="29" r="5"/><path d="M14 25L33 6M26 25L7 6"/></svg>';
  return d;
}
function renderGallery(){
  var g = $("gallery"); g.textContent = "";
  CONFIG.gallery.forEach(function(it){
    var f = el("figure"), src = safeSrc(it.src);
    if (!src){ f.appendChild(placeholder()); }
    else {
      var im = new Image();
      im.loading = "lazy"; im.decoding = "async"; im.referrerPolicy = "no-referrer";
      im.alt = it[lang] || ""; im.src = src;
      im.addEventListener("error", function(){ f.textContent = ""; f.appendChild(placeholder()); });
      f.appendChild(im);
    }
    g.appendChild(f);
  });
}

function setLang(l){
  lang = l; document.documentElement.lang = l;
  try { localStorage.setItem("lang", l); } catch(e){}
  document.querySelectorAll("[data-i18n]").forEach(function(n){ n.textContent = TEXT[l][n.getAttribute("data-i18n")] || ""; });
  document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l)); });
  renderLists(); renderGallery();
}

/* Dados estáticos */
document.querySelectorAll("[data-brand]").forEach(function(n){
  var parts = CONFIG.name.split(" ");
  n.textContent = parts.slice(0,2).join(" ");
  if (parts.length > 2){ var s = el("span", null, " " + parts.slice(2).join(" ")); n.parentNode.replaceChild(document.createDocumentFragment(), n); }
});
(function(){
  var logo = document.querySelector(".logo"); logo.textContent = "";
  var parts = CONFIG.name.split(" ");
  logo.appendChild(document.createTextNode(parts.slice(0,2).join(" ") + " "));
  logo.appendChild(el("span", null, parts.slice(2).join(" ")));
})();
document.title = CONFIG.name + " · Setúbal";
$("addr").textContent = CONFIG.address;
$("addr2").textContent = CONFIG.address;
$("copy").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;
var wa = digits(CONFIG.whatsapp);
$("waLink").href = "https://wa.me/" + wa;
$("waLink").textContent = "+" + wa;
$("dirLink").href = CONFIG.directionsUrl;
(function(){
  var c = CONFIG.mapCoords.split(","), la = parseFloat(c[0]), lo = parseFloat(c[1]);
  var bbox = [lo - 0.0045, la - 0.0027, lo + 0.0045, la + 0.0027].join("%2C");
  $("mapFrame").src = "https://www.openstreetmap.org/export/embed.html?bbox=" + bbox + "&layer=mapnik&marker=" + la + "%2C" + lo;
})();

/* Data mínima = hoje */
var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
$("fDate").min = today.toISOString().slice(0,10);

document.querySelectorAll("[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
});

/* Formulário → WhatsApp (sem enviar dados para servidores) */
var lastSend = 0;
$("bookForm").addEventListener("submit", function(e){
  e.preventDefault();
  var T = TEXT[lang], err = $("err"); err.textContent = "";
  if ($("website").value) return;                       // honeypot anti-bot
  if (Date.now() - lastSend < 3000) return;             // limite de cliques
  var name = $("fName").value.replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,60);
  var phoneRaw = $("fPhone").value.trim();
  var phone = digits(phoneRaw);
  if (name.length < 2){ err.textContent = T.e_name; $("fName").focus(); return; }
  if (!/^[+0-9\s()\-]+$/.test(phoneRaw) || phone.length < 9 || phone.length > 15){ err.textContent = T.e_phone; $("fPhone").focus(); return; }
  var s = CONFIG.services[parseInt($("fService").value,10)] || CONFIG.services[0];
  var d = $("fDate").value, t = $("fTime").value;
  var when = (d ? d.split("-").reverse().join("/") : "") + (t ? " " + t : "");
  var note = $("fMsg").value.replace(/[\u0000-\u001f<>]/g," ").trim().slice(0,300);
  var lines = [ T.msg_hi + CONFIG.name + ".", "", T.msg_name + ": " + name, T.msg_phone + ": +" + phone, T.msg_service + ": " + s[lang] ];
  if (when.trim()) lines.push(T.msg_when + ": " + when.trim());
  if (note) lines.push(T.msg_note + ": " + note);
  lastSend = Date.now();
  window.open("https://wa.me/" + wa + "?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener,noreferrer");
});

setLang(lang);
})();
</script>
</body>
</html>
